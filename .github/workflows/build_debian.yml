name: Docker Build & Publish
run-name: Build EDL ${{ inputs.edl_version }} (${{ inputs.edl_branch }})

on:
  workflow_call:
    inputs: &workflow_inputs
      edl_branch:
        description: 'Target EDL git branch or tag in bkerler/edl'
        type: string
        required: true
        default: master
      edl_version:
        description: 'Assigned image version (e.g. 3.52.1 or latest)'
        type: string
        required: true
        default: latest
      edl_latest:
        description: 'Mark this build as latest (:latest and :debian tags)'
        type: boolean
        required: false
        default: false
      push_image:
        description: 'Push image to GitHub Container Registry'
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs: *workflow_inputs

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        id: checkout-repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup QEMU
        id: setup-qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/boardport/edl
          tags: |
            type=raw,value=${{ inputs.edl_version }}
            type=raw,value=v${{ inputs.edl_version }},enable=${{ inputs.edl_version != 'latest' && !startsWith(inputs.edl_version, 'v') }}
            type=raw,value=${{ inputs.edl_version }}-debian
            type=raw,value=v${{ inputs.edl_version }}-debian,enable=${{ inputs.edl_version != 'latest' && !startsWith(inputs.edl_version, 'v') }}
            type=raw,value=debian,enable=${{ inputs.edl_latest }}
            type=raw,value=latest,enable=${{ inputs.edl_latest }}
          labels: |
            org.opencontainers.image.title=BoardPort Qualcomm EDL Container
            org.opencontainers.image.description=Production-ready Debian-based Qualcomm Sahara and Firehose EDL 9008 container image by BoardPort
            org.opencontainers.image.vendor=BoardPort Community <boardport@proton.me>
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.edl_version }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.debian
          push: ${{ inputs.push_image }}
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            EDL_BRANCH=${{ inputs.edl_branch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
